# More option see https://github.com/DreamMaoMao/mango/wiki/

# monitorrule=name:^DP-2$,width:3440,height:1440,refresh:240,x:0,y:10,vrr:1
# monitorrule=name:^DP-1$,width:1920,height:1080,refresh:60,x:3465,y:0,vrr:0

# Autostart
# exec-once=systemctl --user restart xdg-desktop-portal*
# // spawn-at-startup "nohup" "steam" "-tenfoot" "&"
# // spawn-at-startup "exec-once = wal-tile-swaybg $(cat ~/.cache/wal/wal)"
exec-once=wal-tile-swaybg "$(tail -22 ~/.config/waypaper/config.ini | grep -o '~.*' | cut -c 3-)\"
# // spawn-sh-at-startup "wal-tile-swaybg \"$(tail -22 ~/.config/waypaper/config.ini | grep -o '~.*' | cut -c 3-)\""
# // spawn-at-startup "exec = pkill waybar ; waybar"
exec-once=fcitx5
exec-once=swaync
# exec-once=nm-applet
# // spawn-at-startup "hypridle"
# // spawn-at-startup "vesktop"
# // spawn-at-startup "flatpak" "run" "dev.vencord.Vesktop"
# exec-once=equibop
# // spawn-at-startup "easyeffects"
# exec-once="swayidle.sh
# // spawn-at-startup "waycorner
exec-once=wlsunset -l 47 -L -122
exec-once=waybar
# spawn-at-startup wheelbinds.py
# spawn-at-startup steam -silent


# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=12
no_radius_when_single=0
focused_opacity=0.9
unfocused_opacity=0.8

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.5
# scroller_default_proportion=0.25
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=0
edge_scroller_pointer_focus=1
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=1.0,0.75,0.66667,0.5,0.33333,0.25

# Master-Stack Layout Setting
new_is_master=0
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
hotarea_corner=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x201b14ff
bordercolor=0x444444ff
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# vrr_only_fullscreen=1

windowrule=focused_opacity:1.0,unfocused_opacity:1.0,appid:^vesktop$,title:general


# windowrule=appid:^zen$,force_maximize:1
# windowrule=appid:^vesktop$,force_maximize:1
# windowrule=appid:^equibop$,force_maximize:1
# windowrule=appid:^com\.github\.wwmm\.easyeffects$,force_maximize:1
# windowrule=appid:^com\.obsproject\.Studio$,force_maximize:1
# windowrule=appid:^org\.gnome\.Boxes$,force_maximize:1
# windowrule=appid:^steam_proton$,force_maximize:1
# windowrule=appid:^steam_app$,force_maximize:1

windowrule=appid:^scrcpy$,focused_opacity:1.0,unfocused_opacity:1.0
windowrule=appid:^osu!$,focused_opacity:1.0,unfocused_opacity:1.0

# Picture-in-Picture
windowrule=title:^Picture-in-Picture$,isfloating:1

# MainPicker
windowrule=title:^MainPicker$,isfloating:1

# Thunar rename dialog
windowrule=appid:^thunar$,title:^Rename$,isfloating:1

# Thunar file operation progress
windowrule=appid:^thunar$,title:^File Operation Progress$,isfloating:1

# Waypaper
windowrule=title:^waypaper$,isfloating:1

# ProtonFixes
windowrule=title:^ProtonFixes$,isfloating:1


# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config

bind=SUPER,d,spawn,rofi -show-icons -show drun
bind=SUPER,Return,spawn,kitty
bind=SUPER+SHIFT,Return,spawn,mousepad
bind=SUPER,a,spawn,swaync-client -t -sw
bind=SUPER+SHIFT,a,spawn,swaync-client -t -sw
# bind=// SUPER,s,spawn,grimshot --notify save anything /tmp/grimshot && ristretto /tmp/grimshot
# bind=SUPER+s,spawn,screenshot-window write-to-disk=false
bind=SUPER+SHIFT,s,spawn,grim -g "$(slurp -o -r -c '##ff0000ff')\" -t ppm - | satty --filename - --fullscreen --output-filename ~/Pictures/Screenshots/satty-$(date '+%Y%m%d-%H:%M:%S').png
bind=SUPER,e,spawn,thunar
# bind=SUPER+SHIFT,e,spawn nirius toggle-follow-mode
# bind=SUPER,r,waypaper && wal-tile-swaybg $(tail -24 ~/.config/waypaper/config.ini | head -1 | cut -c 13-)
bind=SUPER+SHIFT,r,spawn,wal-tile-swaybg "$(tail -24 ~/.config/waypaper/config.ini | head -1 | cut -c 13-)"
# bind=// SUPER+SHIFT+R { spawn "bash" "-c" "wal-tile-swaybg \"$(tail -23 ~/.config/waypaper/config.ini | grep -o '~.*' | cut -c 3-)\""; }
# bind=// SUPER+SHIFT+R { spawn "wal-tile-swaybg" "$(cat ~/.cache/wal/wal)"; }
bind=SUPER,Tab,spawn,rofi -show-icons -show window
bind=SUPER,c,spawn,qalculate-gtk
bind=SUPER+SHIFT,c,spawn,hyprpicker -a
bind=SUPER,w,spawn,~/.local/bin/waybar-toggle.sh
# bind=SUPER+SHIFT,W,screenshot
# bind=// SUPER+SHIFT+T { spawn "jp-region-ocr-copy
bind=SUPER+SHIFT,t,spawn,kitty -e ocr
# bind=SUPER+SHIFT+Tab,toggle-window-rule-opacity
bind=Ctrl+SHIFT,Escape,spawn,kitty -e btop
bind=SUPER,Escape,spawn,power-menu

bind=SUPER,m,quit
bind=SUPER+SHIFT,q,killclient,

# switch window focus
# bind=SUPER,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# swap window
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right

# switch window status
bind=SUPER+SHIFT,e,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=SUPER,f,togglefloating,
bind=SUPER+SHIFT,z,togglemaximizescreen,
bind=SUPER,Q,togglefullscreen,
bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=SUPER,z,switch_proportion_preset,

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

bind=ctrl+Super,1,toggletag,1
bind=ctrl+Super,2,toggletag,2
bind=ctrl+Super,3,toggletag,3
bind=ctrl+Super,4,toggletag,4
bind=ctrl+Super,5,toggletag,5
bind=ctrl+Super,6,toggletag,6
bind=ctrl+Super,7,toggletag,7
bind=ctrl+Super,8,toggletag,8
bind=ctrl+Super,9,toggletag,9

# bind=Super,1,toggleview,1
# bind=Super,2,toggleview,2
# bind=Super,3,toggleview,3
# bind=Super,4,toggleview,4
# bind=Super,5,toggleview,5
# bind=Super,6,toggleview,6
# bind=Super,7,toggleview,7
# bind=Super,8,toggleview,8
# bind=Super,9,toggleview,9

# monitor switch
bind=super+alt,j,focusmon,left
bind=super+alt,k,focusmon,right
bind=SUPER+shift+Alt,j,tagmon,left
bind=SUPER+shift+Alt,k,tagmon,right

# gaps
# bind=ALT+SHIFT,X,incgaps,1
# bind=ALT+SHIFT,Z,incgaps,-1
# bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=CTRL+super,k,resizewin,+0,-50
bind=CTRL+super,j,resizewin,+0,+50
bind=CTRL+super,h,resizewin,-50,+0
bind=CTRL+super,l,resizewin,+50,+0

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize


# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client


# layer rule
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi


# // XF86AudioMute            allow-when-locked=true { spawn "wpctl" "set-mute" "@DEFAULT_AUDIO_SINK@" "toggle"; }
# // Mod+Backspace            allow-when-locked=true { spawn "wpctl" "set-mute" "@DEFAULT_AUDIO_SINK@" "toggle"; }
# XF86AudioMicMute         allow-when-locked=true { spawn "wpctl" "set-mute" "@DEFAULT_AUDIO_SOURCE@" "toggle"; }
bind=Alt,Space,spawn,toggle-mute
# // Mod+XF86AudioRaiseVolume allow-when-locked=true { spawn "bash" "-c" "pactl set-source-volume 0 +5%"; }
# // Mod+XF86AudioLowerVolume allow-when-locked=true { spawn "bash" "-c" "pactl set-source-volume 0 -5%"; }

# bind=XF86AudioMute,spawn,swayosd-client --output-volume mute-toggle
# bind=Mod+Backspace,spawn,swayosd-client --output-volume mute-toggle
# bind=// XF86AudioMicMute         allow-when-locked=true { spawn "swayosd-client" "--input-volume"  "mute-toggle"; }
# bind=// Alt+Space                allow-when-locked=true { spawn "swayosd-client" "--input-volume"  "mute-toggle"; }
# bind=SUPER,XF86AudioRaiseVolume,spawn,swayosd-client --input-volume  raise --max-volume 160
# bind=SUPER,XF86AudioLowerVolume,spawn,swayosd-client --input-volume  lower --max-volume 160

bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl s +10%
# bind=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl s 100%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl s 10%-
# bind=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl s 1%
bind=SUPER,equal,spawn,brightnessctl set +10%
bind=SUPER,minus,spawn,brightnessctl set 10%-
bind=SUPER+SHIFT,equal,spawn,brightnessctl set +5%
bind=SUPER+SHIFT,minus,spawn,brightnessctl set 5%-

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+
# // XF86AudioRaiseVolume     allow-when-locked=true { spawn "bash" "-c" "pactl set-sink-volume @DEFAULT_SINK@ +1% && pactl set-sink-mute @DEFAULT_SINK@ off"; }
# bind=XF86AudioRaiseVolume     allow-when-locked=true { spawn "swayosd-client" "--output-volume" "3"; }
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
# // XF86AudioLowerVolume     allow-when-locked=true { spawn "bash" "-c" "pactl set-sink-volume @DEFAULT_SINK@ -1% && pactl set-sink-mute @DEFAULT_SINK@ off"; }
# bind=XF86AudioLowerVolume     allow-when-locked=true { spawn "swayosd-client" "--output-volume" "-3"; }
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=SHIFT,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle

bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=SUPER,Backslash,spawn,playerctl play-pause
